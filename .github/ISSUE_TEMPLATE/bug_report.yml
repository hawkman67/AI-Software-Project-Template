name: Bug
description: Meld een reproduceerbare fout
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Probleem
      description: Wat gebeurt er?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Verwacht gedrag
      description: Wat had er moeten gebeuren?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduceren
      description: Welke stappen/data reproduceren het probleem?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Bewijs en observaties
      description: Screenshots, logs, expected/actual waarden of andere aanwijzingen. Geen secrets of gevoelige data.

  - type: textarea
    id: impact
    attributes:
      label: Mogelijke impact
      description: Welke flows, data, schema's, gebruikers of compatibiliteit kunnen geraakt zijn?

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptatiecriteria
      description: Wanneer is dit aantoonbaar opgelost?
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regressietest
      description: Welke test moet vóór de fix falen en na de fix slagen, en bij welke centrale eigenaar hoort die test?
